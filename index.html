<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTML Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,0.12);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,0.12);
    --amber: #d29922;
    --red: #f85149;
    --radius: 6px;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

  /* ── TITLEBAR ── */
  #titlebar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    user-select: none;
  }
  #titlebar .logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  #titlebar .logo span { color: var(--muted); font-weight: 400; }
  #titlebar .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  #titlebar .filename {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    min-width: 80px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #titlebar .filename.dirty::after { content: ' •'; color: var(--amber); }
  #titlebar .spacer { flex: 1; }
  #titlebar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #titlebar .status-dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
  #titlebar .status-dot.dirty { background: var(--amber); box-shadow: 0 0 0 3px rgba(210,153,34,0.12); }
  #titlebar .status-label { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:hover { background: #2d333b; border-color: #636e7b; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(88,166,255,0.2); }
  .btn.success { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .btn.success:hover { background: rgba(63,185,80,0.2); }
  .btn.toggle-on { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .btn.toggle-on .dot { background: var(--green); }
  .btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
  .btn svg { flex-shrink: 0; }
  .btn.icon-only { padding: 0 9px; }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #editor-pane { display: flex; flex-direction: column; width: 50%; min-width: 200px; border-right: 1px solid var(--border); overflow: hidden; }
  #preview-pane { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #cm-wrap, .CodeMirror, .CodeMirror-scroll, .CodeMirror-sizer { max-width: 100%; }
  #app.editor-fullscreen #preview-pane,
  #app.editor-fullscreen #drag-handle,
  #app.preview-fullscreen #editor-pane,
  #app.preview-fullscreen #drag-handle { display: none !important; }
  #app.editor-fullscreen #editor-pane,
  #app.preview-fullscreen #preview-pane {
    width: 100% !important;
    flex: 1 1 100%;
    border-right: none;
  }

  /* ── PANE HEADERS ── */
  .pane-header {
    height: 36px; padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border2);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .pane-header .pane-title { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .pane-header .spacer { flex: 1; }
  .pane-header .char-count { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .lang-badge {
    font-size: 10px; font-family: var(--font-mono);
    background: rgba(88,166,255,0.1); color: var(--accent);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 4px; padding: 1px 6px;
  }
  .pane-actions { display: flex; align-items: center; gap: 6px; }

  /* ── DRAG HANDLE ── */
  #drag-handle {
    width: 4px; cursor: col-resize; background: var(--border);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #drag-handle:hover, #drag-handle.dragging { background: var(--accent); }

  /* ── CODEMIRROR OVERRIDES ── */
  .CodeMirror {
    height: 100% !important;
    font-family: var(--font-mono) !important;
    font-size: 13px !important;
    line-height: 1.65 !important;
    background: var(--bg) !important;
  }
  .CodeMirror-scroll { height: 100% !important; }
  #cm-wrap { flex: 1; overflow: hidden; }

  /* ── PREVIEW IFRAME ── */
  #preview-frame {
    flex: 1; width: 100%; border: none;
    background: #fff;
  }
  .preview-placeholder {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    color: var(--muted);
  }
  .preview-placeholder .icon {
    width: 48px; height: 48px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-placeholder p { font-size: 13px; }
  .preview-placeholder .hint { font-size: 11px; color: #484f58; }
  #preview-error {
    display: none;
    padding: 10px 12px;
    background: rgba(248,81,73,0.1);
    border-bottom: 1px solid rgba(248,81,73,0.22);
    color: #ffb4ae;
    font-size: 12px;
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #preview-error.visible { display: block; }

  /* ── LIVE BADGE ── */
  #live-badge {
    display: none;
    align-items: center; gap: 5px;
    font-size: 11px; color: var(--green);
    font-weight: 500;
  }
  #live-badge.visible { display: flex; }
  #live-badge::before {
    content: ''; display: block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── DROP ZONE ── */
  #drop-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(88,166,255,0.07);
    border: 2px dashed var(--accent);
    border-radius: 8px;
    z-index: 100;
    align-items: center; justify-content: center;
    font-size: 18px; color: var(--accent); font-weight: 500;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  /* ── RESTORE BANNER ── */
  #draft-restore {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(210,153,34,0.1);
    border-bottom: 1px solid rgba(210,153,34,0.18);
    color: #f2cc60;
    font-size: 12px;
  }
  #draft-restore.show { display: flex; }
  #draft-restore .message { flex: 1; }

  /* ── FIND PANEL ── */
  #find-panel {
    display: none;
    position: fixed;
    top: 62px;
    right: 16px;
    width: min(360px, calc(100vw - 32px));
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    z-index: 1200;
  }
  #find-panel.visible { display: block; }
  .find-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .find-row:last-child { margin-bottom: 0; }
  .find-row input {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 32px;
    padding: 0 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: 12px var(--font-ui);
  }
  .find-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
  }
  #find-status {
    min-width: 68px;
    color: var(--muted);
    font-size: 11px;
    text-align: right;
    font-family: var(--font-mono);
  }
  .find-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 8px 16px;
    border-radius: 20px; opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* ── UPLOAD INPUT ── */
  #file-input { display: none; }

  /* ── RESPONSIVE VISIBILITY ── */
  .mobile-only { display: none !important; }

  /* ── MOBILE LAYOUT ── */
  @media (max-width: 767px) {
    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    #main,
    #editor-pane,
    #cm-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    .mobile-only  { display: inline-flex !important; }
    .desktop-only { display: none !important; }

    #drag-handle  { display: none !important; }
    #preview-pane { display: none !important; }

    #editor-pane {
      width: 100% !important;
      border-right: none;
    }

    #titlebar {
      height: auto;
      min-height: 52px;
      flex-wrap: wrap;
      padding: 8px 12px;
      row-gap: 6px;
      column-gap: 6px;
      overflow-x: hidden;
    }

    #titlebar .sep    { display: none; }
    #titlebar .filename {
      min-width: 0;
      max-width: 120px;
    }

    #titlebar .spacer {
      display: none;
    }

    .btn {
      height: 38px;
      min-width: 0;
      padding: 0 10px;
      font-size: 12px;
      flex: 0 1 auto;
    }

    .status-label {
      margin-right: auto;
    }

    #find-panel,
    #draft-restore {
      display: none !important;
    }

    .CodeMirror {
      width: 100% !important;
      max-width: 100% !important;
      font-size: 14px !important;
    }
    .CodeMirror-lines {
      padding-bottom: 16em !important;
    }
    .CodeMirror-scroll {
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .CodeMirror-lines,
    .CodeMirror-line {
      max-width: 100%;
    }
    .CodeMirror textarea,
    .CodeMirror input {
      font-size: 16px !important;
    }
    .CodeMirror { font-size: 14px !important; }
    .CodeMirror-gutters { min-width: 36px; }
    .CodeMirror-linenumber { padding: 0 6px 0 2px; }
  }

  /* ── MINIMAP (resize hint) ── */
  .resize-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--muted); pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLEBAR -->
  <div id="titlebar">
    <div class="logo">&lt;<span>/</span>&gt; html<span>viewer</span></div>
    <div class="sep"></div>
    <div class="filename" id="filename-display">untitled.html</div>
    <div class="spacer"></div>
    <div id="status-dot" class="status-dot"></div>
    <div class="status-label" id="status-label">ready</div>
    <div class="sep"></div>
    <label for="file-input">
      <div class="btn" tabindex="0" role="button" onkeydown="if(event.key==='Enter')document.getElementById('file-input').click()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M4 6l4-5 4 5M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Upload
      </div>
    </label>
    <input type="file" id="file-input" accept=".html,.htm">
    <button class="btn primary desktop-only" id="btn-preview">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
      Preview
    </button>
    <button class="btn desktop-only" id="btn-sync">
      <span class="dot"></span>
      Live Sync
    </button>
    <button class="btn desktop-only" id="btn-clear">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9a1 1 0 001 1h6a1 1 0 001-1l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Clear
    </button>
    <button class="btn desktop-only" id="btn-find" title="Find and replace">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Find
    </button>
    <button class="btn desktop-only" id="btn-wrap" title="Toggle word wrap">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h9a2.5 2.5 0 010 5H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 7l-2 2 2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 9h3M2 12h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Wrap
    </button>
    <button class="btn desktop-only" id="btn-undo" title="Undo (Cmd/Ctrl+Z)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 8h6a4 4 0 110 8H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn desktop-only" id="btn-redo" title="Redo (Cmd/Ctrl+Shift+Z)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 8H7a4 4 0 100 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- Mobile-only actions -->
    <button class="btn mobile-only" id="btn-select-all">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M4 8h8M8 4v8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Select All
    </button>
    <button class="btn mobile-only" id="btn-copy-all">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="5" y="2" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 5.5V13a1.5 1.5 0 001.5 1.5H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Copy
    </button>
    <button class="btn primary mobile-only" id="btn-open-new-mobile">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 2H2a1 1 0 00-1 1v11a1 1 0 001 1h11a1 1 0 001-1v-4M10 1h5v5M15 1L7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Open Tab
    </button>
  </div>

  <!-- MAIN SPLIT AREA -->
  <div id="main">
    <!-- EDITOR PANE -->
    <div id="editor-pane">
      <div class="pane-header">
        <div class="pane-title">editor</div>
        <div class="lang-badge">HTML</div>
        <div class="spacer"></div>
        <button class="btn desktop-only" id="btn-copy-all-desktop">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="5" y="2" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 5.5V13a1.5 1.5 0 001.5 1.5H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Copy
        </button>
        <div class="pane-actions desktop-only">
          <button class="btn icon-only" id="btn-editor-fullscreen" title="Toggle editor fullscreen">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M6 2H2v4M10 2h4v4M14 10v4h-4M2 10v4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="live-badge">live</div>
        <div class="char-count" id="char-count">0 chars</div>
      </div>
      <div id="cm-wrap"></div>
    </div>

    <!-- DRAG HANDLE -->
    <div id="drag-handle"></div>

    <!-- PREVIEW PANE -->
    <div id="preview-pane">
      <div class="pane-header">
        <div class="pane-title">preview</div>
        <div class="spacer"></div>
        <div class="pane-actions desktop-only">
          <button class="btn icon-only" id="btn-preview-fullscreen" title="Toggle preview fullscreen">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M6 2H2v4M10 2h4v4M14 10v4h-4M2 10v4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button class="btn" id="btn-open-new" title="Open in new tab">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M6 2H2a1 1 0 00-1 1v11a1 1 0 001 1h11a1 1 0 001-1v-4M10 1h5v5M15 1L7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Open tab
        </button>
        <button class="btn" id="btn-refresh-preview" title="Reload preview">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M1 8a7 7 0 1012.9-3.8M1 8V3m0 5H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Reload
        </button>
      </div>
      <div id="preview-error"></div>
      <div class="preview-placeholder" id="preview-placeholder">
        <div class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7 8l3 3-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <p>No preview yet</p>
        <p class="hint">Paste HTML and click Preview — or enable Live Sync</p>
      </div>
      <iframe id="preview-frame" title="HTML Preview" sandbox="allow-scripts allow-same-origin" style="display:none;"></iframe>
    </div>
  </div>
</div>

<div id="draft-restore">
  <div class="message" id="draft-restore-message">A saved draft was found from your last session.</div>
  <button class="btn" id="btn-restore-draft">Restore draft</button>
  <button class="btn" id="btn-dismiss-draft">Dismiss</button>
</div>

<!-- DROP OVERLAY -->
<div id="drop-overlay">Drop your HTML file here</div>

<!-- TOAST -->
<div id="toast"></div>

<div id="find-panel" class="desktop-only">
  <div class="find-row">
    <input id="find-input" type="text" placeholder="Find">
    <div id="find-status">0 / 0</div>
  </div>
  <div class="find-row">
    <input id="replace-input" type="text" placeholder="Replace with">
  </div>
  <div class="find-actions">
    <button class="btn" id="btn-find-prev">Prev</button>
    <button class="btn" id="btn-find-next">Next</button>
    <button class="btn" id="btn-replace-one">Replace</button>
    <button class="btn" id="btn-replace-all">Replace All</button>
    <button class="btn" id="btn-close-find">Close</button>
  </div>
</div>

<script>
  const STARTER = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f9f9f9;
      color: #1a1a1a;
    }
    h1 { color: #2563eb; }
    p { line-height: 1.7; color: #444; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>Edit this HTML in the editor and click <strong>Preview</strong> to see it rendered — or toggle <strong>Live Sync</strong> to see changes update automatically.</p>
</body>
</html>`;
  const AUTOSAVE_KEY = 'html-viewer-autosave-v1';
  const AUTOSAVE_META_KEY = 'html-viewer-autosave-meta-v1';
  const PREVIEW_HOOK = `<script>
window.addEventListener('error', function (event) {
  try {
    parent.postMessage({ source: 'html-viewer-preview', type: 'error', message: event.message || 'Script error' }, '*');
  } catch (e) {}
});
window.addEventListener('unhandledrejection', function (event) {
  try {
    var reason = event.reason;
    parent.postMessage({ source: 'html-viewer-preview', type: 'error', message: reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection') }, '*');
  } catch (e) {}
});
window.addEventListener('DOMContentLoaded', function () {
  try {
    parent.postMessage({ source: 'html-viewer-preview', type: 'loaded' }, '*');
  } catch (e) {}
});
<\/script>`;

  // ── CodeMirror setup ──
  const LARGE_FILE_THRESHOLD = 800;
  const app = document.getElementById('app');
  const cmWrap = document.getElementById('cm-wrap');
  const editor = CodeMirror(cmWrap, {
    value: STARTER,
    mode: 'htmlmixed',
    theme: 'dracula',
    lineNumbers: true,
    lineWrapping: true,
    autoCloseTags: true,
    matchBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    flattenSpans: false,
    addModeClass: false,
    viewportMargin: 50,
    pollInterval: 100,
    extraKeys: { Tab: cm => cm.replaceSelection('  ') },
  });

  function applyModeForSize(lineCount) {
    const currentMode = editor.getOption('mode');
    if (lineCount > LARGE_FILE_THRESHOLD && currentMode !== 'xml') {
      editor.setOption('mode', 'xml');
      editor.setOption('matchBrackets', false);
      showToast(`Large file — using fast mode (${lineCount} lines)`);
    } else if (lineCount <= LARGE_FILE_THRESHOLD && currentMode !== 'htmlmixed') {
      editor.setOption('mode', 'htmlmixed');
      editor.setOption('matchBrackets', true);
    }
  }

  function isMobileView() {
    return window.matchMedia('(max-width: 767px)').matches;
  }

  function optimizeEditorForViewport() {
    editor.setOption('viewportMargin', isMobileView() ? 12 : 50);
    editor.refresh();
  }

  // ── State ──
  let liveSync = false;
  let liveTimer = null;
  let mobileSelectionPrimed = false;
  let wordWrapEnabled = true;
  let currentBaseline = STARTER;
  let autosaveTimer = null;
  let currentFullscreenPane = null;
  let lastSearchMatches = [];
  let lastSearchIndex = -1;

  // ── Refs ──
  const btnPreview = document.getElementById('btn-preview');
  const btnSync = document.getElementById('btn-sync');
  const btnClear = document.getElementById('btn-clear');
  const btnFind = document.getElementById('btn-find');
  const btnWrap = document.getElementById('btn-wrap');
  const btnUndo = document.getElementById('btn-undo');
  const btnRedo = document.getElementById('btn-redo');
  const btnOpenNew = document.getElementById('btn-open-new');
  const btnRefresh = document.getElementById('btn-refresh-preview');
  const btnEditorFullscreen = document.getElementById('btn-editor-fullscreen');
  const btnPreviewFullscreen = document.getElementById('btn-preview-fullscreen');
  const fileInput = document.getElementById('file-input');
  const frame = document.getElementById('preview-frame');
  const placeholder = document.getElementById('preview-placeholder');
  const previewError = document.getElementById('preview-error');
  const statusDot = document.getElementById('status-dot');
  const statusLabel = document.getElementById('status-label');
  const charCount = document.getElementById('char-count');
  const liveBadge = document.getElementById('live-badge');
  const filenameDisplay = document.getElementById('filename-display');
  const toast = document.getElementById('toast');
  const dropOverlay = document.getElementById('drop-overlay');
  const btnSelectAll = document.getElementById('btn-select-all');
  const btnCopyAll = document.getElementById('btn-copy-all');
  const btnCopyAllDesktop = document.getElementById('btn-copy-all-desktop');
  const draftRestore = document.getElementById('draft-restore');
  const draftRestoreMessage = document.getElementById('draft-restore-message');
  const btnRestoreDraft = document.getElementById('btn-restore-draft');
  const btnDismissDraft = document.getElementById('btn-dismiss-draft');
  const findPanel = document.getElementById('find-panel');
  const findInput = document.getElementById('find-input');
  const replaceInput = document.getElementById('replace-input');
  const findStatus = document.getElementById('find-status');
  const btnFindPrev = document.getElementById('btn-find-prev');
  const btnFindNext = document.getElementById('btn-find-next');
  const btnReplaceOne = document.getElementById('btn-replace-one');
  const btnReplaceAll = document.getElementById('btn-replace-all');
  const btnCloseFind = document.getElementById('btn-close-find');
  const btnOpenNewMobile = document.getElementById('btn-open-new-mobile');
  const scroller = editor.getScrollerElement();

  function setStatus(type, label) {
    statusDot.className = 'status-dot' + (type === 'live' ? ' live' : '');
    statusLabel.textContent = label;
  }

  function updateDirtyState() {
    const dirty = editor.getValue() !== currentBaseline;
    filenameDisplay.classList.toggle('dirty', dirty);
    if (dirty) {
      statusDot.className = 'status-dot dirty';
      statusLabel.textContent = 'unsaved';
    } else if (liveSync) {
      setStatus('live', 'live');
    } else {
      setStatus('ready', 'ready');
    }
  }

  function rememberBaseline(value, label = 'ready') {
    currentBaseline = value;
    filenameDisplay.classList.remove('dirty');
    setStatus(liveSync ? 'live' : 'ready', liveSync ? 'live' : label);
  }

  function updateCharCount() {
    const value = editor.getValue();
    const lines = editor.lineCount();
    charCount.textContent = `${value.length.toLocaleString()} chars · ${lines} ln`;
    applyModeForSize(lines);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function autosaveDraft() {
    try {
      localStorage.setItem(AUTOSAVE_KEY, editor.getValue());
      localStorage.setItem(AUTOSAVE_META_KEY, JSON.stringify({
        filename: filenameDisplay.textContent,
        savedAt: Date.now()
      }));
    } catch (err) {
      showToast('Autosave unavailable');
    }
  }

  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(autosaveDraft, 350);
  }

  function clearDraftBanner() {
    draftRestore.classList.remove('show');
  }

  function hidePreviewError() {
    previewError.classList.remove('visible');
    previewError.textContent = '';
  }

  function showPreviewError(message) {
    previewError.textContent = `Preview error: ${message}`;
    previewError.classList.add('visible');
  }

  function injectPreviewHook(html) {
    if (html.includes("source: 'html-viewer-preview'")) return html;
    if (/<\/head>/i.test(html)) return html.replace(/<\/head>/i, `${PREVIEW_HOOK}</head>`);
    if (/<body[^>]*>/i.test(html)) return html.replace(/<body([^>]*)>/i, `<body$1>${PREVIEW_HOOK}`);
    return `${PREVIEW_HOOK}${html}`;
  }

  function renderPreview(html) {
    hidePreviewError();
    frame.style.display = 'block';
    placeholder.style.display = 'none';
    const blob = new Blob([injectPreviewHook(html)], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    frame.onload = () => URL.revokeObjectURL(url);
    frame.src = url;
  }

  function schedLiveUpdate() {
    clearTimeout(liveTimer);
    const delay = editor.lineCount() > LARGE_FILE_THRESHOLD ? 800 : 420;
    liveTimer = setTimeout(() => {
      const html = editor.getValue().trim();
      if (html) renderPreview(html);
      setStatus('live', 'live');
    }, delay);
  }

  function setWordWrap(enabled) {
    if (isMobileView()) enabled = true;
    wordWrapEnabled = enabled;
    editor.setOption('lineWrapping', enabled);
    btnWrap.classList.toggle('toggle-on', enabled);
    editor.refresh();
    showToast(enabled ? 'Word wrap on' : 'Word wrap off');
  }

  function setFullscreenPane(pane) {
    currentFullscreenPane = currentFullscreenPane === pane ? null : pane;
    app.classList.toggle('editor-fullscreen', currentFullscreenPane === 'editor');
    app.classList.toggle('preview-fullscreen', currentFullscreenPane === 'preview');
    btnEditorFullscreen.classList.toggle('toggle-on', currentFullscreenPane === 'editor');
    btnPreviewFullscreen.classList.toggle('toggle-on', currentFullscreenPane === 'preview');
    editor.refresh();
  }

  function escapeRegExp(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function getSearchMatches(query) {
    if (!query) return [];
    const content = editor.getValue();
    const regex = new RegExp(escapeRegExp(query), 'g');
    const matches = [];
    let match;
    while ((match = regex.exec(content)) !== null) {
      matches.push({ from: match.index, to: match.index + query.length });
      if (match.index === regex.lastIndex) regex.lastIndex += 1;
    }
    return matches;
  }

  function indexToPos(index) {
    return editor.posFromIndex(index);
  }

  function updateFindStatus() {
    const total = lastSearchMatches.length;
    const current = total ? lastSearchIndex + 1 : 0;
    findStatus.textContent = `${current} / ${total}`;
  }

  function selectMatch(index) {
    if (!lastSearchMatches.length) {
      lastSearchIndex = -1;
      updateFindStatus();
      return false;
    }
    lastSearchIndex = (index + lastSearchMatches.length) % lastSearchMatches.length;
    const match = lastSearchMatches[lastSearchIndex];
    const from = indexToPos(match.from);
    const to = indexToPos(match.to);
    editor.setSelection(from, to);
    editor.scrollIntoView({ from, to }, 80);
    editor.focus();
    updateFindStatus();
    return true;
  }

  function refreshSearch(selectFirst = false) {
    lastSearchMatches = getSearchMatches(findInput.value);
    if (!lastSearchMatches.length) {
      lastSearchIndex = -1;
      updateFindStatus();
      return false;
    }
    if (selectFirst || lastSearchIndex >= lastSearchMatches.length || lastSearchIndex < 0) {
      return selectMatch(0);
    }
    updateFindStatus();
    return true;
  }

  function toggleFindPanel(forceOpen) {
    const open = forceOpen ?? !findPanel.classList.contains('visible');
    findPanel.classList.toggle('visible', open);
    if (open) {
      refreshSearch(true);
      setTimeout(() => findInput.focus(), 0);
    } else {
      editor.focus();
    }
  }

  function loadFile(file) {
    if (!file || !file.name.match(/\.html?$/i)) {
      showToast('Please upload an .html or .htm file');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const value = e.target.result;
      editor.setValue(value);
      filenameDisplay.textContent = file.name;
      applyModeForSize(editor.lineCount());
      rememberBaseline(value, 'file loaded');
      clearDraftBanner();
      autosaveDraft();
      showToast(`Loaded: ${file.name}`);
      if (liveSync) schedLiveUpdate();
    };
    reader.readAsText(file);
  }

  editor.on('change', () => {
    updateCharCount();
    mobileSelectionPrimed = false;
    scheduleAutosave();
    if (findPanel.classList.contains('visible')) refreshSearch();
    setStatus('ready', 'editing…');
    updateDirtyState();
    if (liveSync) schedLiveUpdate();
  });
  updateCharCount();
  updateDirtyState();

  btnPreview.addEventListener('click', () => {
    const html = editor.getValue().trim();
    if (!html) {
      showToast('Editor is empty');
      return;
    }
    renderPreview(html);
    setStatus('ready', 'previewing');
    showToast('Preview updated');
  });

  btnSync.addEventListener('click', () => {
    liveSync = !liveSync;
    btnSync.classList.toggle('toggle-on', liveSync);
    btnSync.querySelector('.dot').style.background = liveSync ? 'var(--green)' : '';
    liveBadge.classList.toggle('visible', liveSync);
    if (liveSync) {
      setStatus('live', 'live');
      schedLiveUpdate();
      showToast('Live sync on — edits update preview automatically');
    } else {
      updateDirtyState();
      showToast('Live sync off');
    }
  });

  btnRefresh.addEventListener('click', () => {
    const value = editor.getValue();
    if (!value.trim()) {
      showToast('Editor is empty');
      return;
    }
    renderPreview(value);
    showToast('Preview reloaded');
  });

  btnOpenNew.addEventListener('click', () => {
    const html = editor.getValue();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  btnClear.addEventListener('click', () => {
    if (!confirm('Clear all editor content?')) return;
    editor.setValue('');
    editor.focus();
    frame.style.display = 'none';
    placeholder.style.display = '';
    hidePreviewError();
    filenameDisplay.textContent = 'untitled.html';
    rememberBaseline('', 'ready');
    autosaveDraft();
    showToast('Editor cleared');
  });

  btnFind.addEventListener('click', () => toggleFindPanel());
  btnWrap.addEventListener('click', () => setWordWrap(!wordWrapEnabled));

  btnUndo.addEventListener('click', () => {
    editor.execCommand('undo');
    editor.focus();
    showToast('Undo');
  });

  btnRedo.addEventListener('click', () => {
    editor.execCommand('redo');
    editor.focus();
    showToast('Redo');
  });

  fileInput.addEventListener('change', e => {
    loadFile(e.target.files[0]);
    fileInput.value = '';
  });

  document.addEventListener('dragover', e => {
    e.preventDefault();
    dropOverlay.classList.add('show');
  });
  document.addEventListener('dragleave', e => {
    if (!e.relatedTarget) dropOverlay.classList.remove('show');
  });
  document.addEventListener('drop', e => {
    e.preventDefault();
    dropOverlay.classList.remove('show');
    loadFile(e.dataTransfer.files[0]);
  });

  const dragMask = document.createElement('div');
  dragMask.style.cssText = 'display:none;position:fixed;inset:0;z-index:9999;cursor:col-resize;';
  document.body.appendChild(dragMask);

  const handle = document.getElementById('drag-handle');
  const editorPane = document.getElementById('editor-pane');
  const main = document.getElementById('main');
  let dragging = false;
  let startX = 0;
  let startW = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = editorPane.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    frame.style.pointerEvents = 'none';
    dragMask.style.display = 'block';
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const total = main.offsetWidth;
    const newW = Math.max(180, Math.min(total - 200, startW + dx));
    editorPane.style.width = newW + 'px';
    editor.refresh();
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    frame.style.pointerEvents = '';
    dragMask.style.display = 'none';
    editor.refresh();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (findPanel.classList.contains('visible')) {
        e.preventDefault();
        toggleFindPanel(false);
      } else if (currentFullscreenPane) {
        e.preventDefault();
        setFullscreenPane(currentFullscreenPane);
      }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
      e.preventDefault();
      toggleFindPanel(true);
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      btnPreview.click();
    }
  });

  btnFindNext.addEventListener('click', () => {
    if (!refreshSearch(lastSearchIndex === -1)) {
      showToast('No matches found');
      return;
    }
    selectMatch(lastSearchIndex + 1);
  });

  btnFindPrev.addEventListener('click', () => {
    if (!refreshSearch(lastSearchIndex === -1)) {
      showToast('No matches found');
      return;
    }
    selectMatch(lastSearchIndex - 1);
  });

  btnReplaceOne.addEventListener('click', () => {
    if (!refreshSearch(lastSearchIndex === -1)) {
      showToast('No matches found');
      return;
    }
    const match = lastSearchMatches[lastSearchIndex];
    editor.replaceRange(replaceInput.value, indexToPos(match.from), indexToPos(match.to));
    refreshSearch(true);
    showToast('Match replaced');
  });

  btnReplaceAll.addEventListener('click', () => {
    const query = findInput.value;
    if (!query) {
      showToast('Enter text to find');
      return;
    }
    const matches = getSearchMatches(query);
    if (!matches.length) {
      showToast('No matches found');
      return;
    }
    editor.operation(() => {
      for (let i = matches.length - 1; i >= 0; i -= 1) {
        const match = matches[i];
        editor.replaceRange(replaceInput.value, indexToPos(match.from), indexToPos(match.to));
      }
    });
    refreshSearch(true);
    showToast(`Replaced ${matches.length} match${matches.length === 1 ? '' : 'es'}`);
  });

  btnCloseFind.addEventListener('click', () => toggleFindPanel(false));
  findInput.addEventListener('input', () => refreshSearch(true));
  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.shiftKey) btnFindPrev.click();
      else btnFindNext.click();
    }
  });
  replaceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      btnReplaceOne.click();
    }
  });

  btnEditorFullscreen.addEventListener('click', () => setFullscreenPane('editor'));
  btnPreviewFullscreen.addEventListener('click', () => setFullscreenPane('preview'));

  window.addEventListener('message', event => {
    const data = event.data;
    if (!data || data.source !== 'html-viewer-preview') return;
    if (data.type === 'error') {
      showPreviewError(data.message || 'Script error');
      setStatus('ready', 'preview warning');
    }
  });

  btnRestoreDraft.addEventListener('click', () => {
    const savedDraft = localStorage.getItem(AUTOSAVE_KEY);
    if (savedDraft == null) return;
    const meta = JSON.parse(localStorage.getItem(AUTOSAVE_META_KEY) || '{}');
    editor.setValue(savedDraft);
    if (meta.filename) filenameDisplay.textContent = meta.filename;
    clearDraftBanner();
    showToast('Draft restored');
  });

  btnDismissDraft.addEventListener('click', () => {
    clearDraftBanner();
    localStorage.removeItem(AUTOSAVE_KEY);
    localStorage.removeItem(AUTOSAVE_META_KEY);
    showToast('Draft dismissed');
  });

  btnSelectAll.addEventListener('click', () => {
    editor.execCommand('selectAll');
    editor.focus();
    mobileSelectionPrimed = true;
    showToast('All code selected');
  });

  btnCopyAll.addEventListener('click', async () => {
    if (!mobileSelectionPrimed) {
      showToast('Tap Select All first');
      return;
    }
    const value = editor.getValue();
    if (!value) {
      showToast('Editor is empty');
      return;
    }
    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
      } else {
        editor.execCommand('selectAll');
        document.execCommand('copy');
      }
      editor.focus();
      showToast('All code copied');
    } catch (err) {
      showToast('Copy failed');
    }
  });

  btnCopyAllDesktop.addEventListener('click', async () => {
    const value = editor.getValue();
    if (!value) {
      showToast('Editor is empty');
      return;
    }
    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
      } else {
        editor.execCommand('selectAll');
        document.execCommand('copy');
      }
      editor.focus();
      showToast('All code copied');
    } catch (err) {
      showToast('Copy failed');
    }
  });

  btnOpenNewMobile.addEventListener('click', () => {
    const html = editor.getValue().trim();
    if (!html) {
      showToast('Editor is empty');
      return;
    }
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  let pinchStartDist = null;
  let pinchStartSize = 13;
  let currentFontSize = 13;
  let scrollTouchStartY = null;

  function setEditorFontSize(px) {
    currentFontSize = Math.min(36, Math.max(8, px));
    editor.getWrapperElement().style.fontSize = currentFontSize + 'px';
    editor.refresh();
  }

  cmWrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartSize = currentFontSize;
      e.preventDefault();
    }
  }, { passive: false });

  cmWrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist !== null) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setEditorFontSize(Math.round(pinchStartSize * (dist / pinchStartDist)));
      e.preventDefault();
    }
  }, { passive: false });

  cmWrap.addEventListener('touchend', e => {
    if (e.touches.length < 2) pinchStartDist = null;
  });

  scroller.addEventListener('touchstart', e => {
    if (!isMobileView() || e.touches.length !== 1) return;
    scrollTouchStartY = e.touches[0].clientY;
  }, { passive: true });

  scroller.addEventListener('touchmove', e => {
    if (!isMobileView() || e.touches.length !== 1 || scrollTouchStartY === null) return;
    const currentY = e.touches[0].clientY;
    const deltaY = currentY - scrollTouchStartY;
    const atTop = scroller.scrollTop <= 0;
    const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;

    if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
      e.preventDefault();
    }
  }, { passive: false });

  scroller.addEventListener('touchend', () => {
    scrollTouchStartY = null;
  }, { passive: true });

  window.addEventListener('resize', optimizeEditorForViewport);

  const savedDraft = localStorage.getItem(AUTOSAVE_KEY);
  if (savedDraft !== null && savedDraft !== STARTER) {
    try {
      const meta = JSON.parse(localStorage.getItem(AUTOSAVE_META_KEY) || '{}');
      const when = meta.savedAt ? new Date(meta.savedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
      draftRestoreMessage.textContent = when
        ? `A saved draft from ${when} was found from your last session.`
        : 'A saved draft was found from your last session.';
    } catch (err) {}
    draftRestore.classList.add('show');
  } else {
    autosaveDraft();
  }

  optimizeEditorForViewport();
  setTimeout(() => editor.refresh(), 50);
</script>
</body>
</html>
