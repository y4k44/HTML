<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTML Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,0.12);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,0.12);
    --amber: #d29922;
    --red: #f85149;
    --radius: 6px;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

  /* ── TITLEBAR ── */
  #titlebar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    user-select: none;
  }
  #titlebar .logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  #titlebar .logo span { color: var(--muted); font-weight: 400; }
  #titlebar .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  #titlebar .filename {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    min-width: 80px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #titlebar .filename.dirty::after { content: ' •'; color: var(--amber); }
  #titlebar .spacer { flex: 1; }
  #titlebar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #titlebar .status-dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
  #titlebar .status-dot.dirty { background: var(--amber); box-shadow: 0 0 0 3px rgba(210,153,34,0.12); }
  #titlebar .status-label { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:hover { background: #2d333b; border-color: #636e7b; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(88,166,255,0.2); }
  .btn.success { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .btn.success:hover { background: rgba(63,185,80,0.2); }
  .btn.toggle-on { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .btn.toggle-on .dot { background: var(--green); }
  .btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
  .btn svg { flex-shrink: 0; }
  .btn.icon-only { padding: 0 9px; }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #editor-pane { display: flex; flex-direction: column; width: 50%; min-width: 200px; border-right: 1px solid var(--border); overflow: hidden; }
  #preview-pane { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #cm-wrap, .CodeMirror, .CodeMirror-scroll, .CodeMirror-sizer { max-width: 100%; }
  #app.editor-fullscreen #preview-pane,
  #app.editor-fullscreen #drag-handle,
  #app.preview-fullscreen #editor-pane,
  #app.preview-fullscreen #drag-handle { display: none !important; }
  #app.editor-fullscreen #editor-pane,
  #app.preview-fullscreen #preview-pane {
    width: 100% !important;
    flex: 1 1 100%;
    border-right: none;
  }

  /* ── PANE HEADERS ── */
  .pane-header {
    height: 36px; padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border2);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .pane-header .pane-title { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .pane-header .spacer { flex: 1; }
  .pane-header .char-count { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .lang-badge {
    font-size: 10px; font-family: var(--font-mono);
    background: rgba(88,166,255,0.1); color: var(--accent);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 4px; padding: 1px 6px;
  }
  .editor-tabs {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 2px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  #app.editor-fullscreen .editor-tabs { display: flex; }
  .editor-tabs .btn {
    height: 24px;
    padding: 0 10px;
    border-color: transparent;
    background: transparent;
    color: var(--muted);
  }
  .editor-tabs .btn:hover {
    background: var(--surface2);
    color: var(--text);
    border-color: transparent;
  }
  .editor-tabs .btn.toggle-on {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(88,166,255,0.35);
  }
  .pane-actions { display: flex; align-items: center; gap: 6px; }
  .preview-device-switcher {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 2px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  #app.preview-fullscreen .preview-device-switcher { display: flex; }
  .preview-device-switcher .btn {
    height: 24px;
    padding: 0 9px;
    border-color: transparent;
    background: transparent;
    color: var(--muted);
  }
  .preview-device-switcher .btn:hover {
    background: var(--surface2);
    color: var(--text);
    border-color: transparent;
  }
  .preview-device-switcher .btn.toggle-on {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(88,166,255,0.35);
  }

  /* ── DRAG HANDLE ── */
  #drag-handle {
    width: 4px; cursor: col-resize; background: var(--border);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #drag-handle:hover, #drag-handle.dragging { background: var(--accent); }

  /* ── CODEMIRROR OVERRIDES ── */
  .CodeMirror {
    height: 100% !important;
    font-family: var(--font-mono) !important;
    font-size: 13px !important;
    line-height: 1.65 !important;
    background: var(--bg) !important;
  }
  .CodeMirror-scroll { height: 100% !important; }

  /* ── EDITOR BODY (cm-wrap + minimap row) ── */
  #editor-body { flex: 1; display: flex; flex-direction: row; overflow: hidden; }
  #cm-wrap { flex: 1; overflow: hidden; min-width: 0; }

  /* ── ERROR LINE HIGHLIGHTING ── */
  .cm-error-line { background: rgba(248,81,73,0.13) !important; }
  .cm-error-gutter { width: 4px !important; }
  .cm-error-gutter-marker {
    width: 3px;
    height: 100%;
    margin: 0 0 0 1px;
    background: var(--red);
    border-radius: 2px;
    display: block;
  }

  /* ── MINIMAP ── */
  #minimap-container {
    width: 0;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--bg);
    border-left: 1px solid transparent;
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: width 0.18s ease, border-color 0.18s ease;
  }
  #app.editor-fullscreen #minimap-container {
    width: 110px;
    border-left-color: var(--border2);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  #app.editor-fullscreen #minimap-container::-webkit-scrollbar { display: none; }
  #minimap-canvas { display: block; image-rendering: pixelated; }
  #minimap-viewport {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.075);
    border-top: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
    min-height: 16px;
    transition: top 0.05s linear;
  }
  #minimap-container:hover #minimap-viewport { background: rgba(255,255,255,0.11); }

  /* ── PREVIEW IFRAME ── */
  #preview-stage {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: center;
    overflow: auto;
    background: #fff;
  }
  #preview-frame {
    flex: 1 1 auto; width: 100%; min-height: 100%; border: none;
    background: #fff;
  }
  #app.preview-fullscreen #preview-stage {
    padding: 16px;
    background: #0b0f14;
  }
  #app.preview-fullscreen.device-desktop #preview-frame {
    width: 100%;
    max-width: none;
  }
  #app.preview-fullscreen.device-tablet #preview-frame {
    flex: 0 0 820px;
    width: 820px;
    max-width: 100%;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  #app.preview-fullscreen.device-mobile #preview-frame {
    flex: 0 0 390px;
    width: 390px;
    max-width: 100%;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .preview-placeholder {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    color: var(--muted);
  }
  .preview-placeholder .icon {
    width: 48px; height: 48px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-placeholder p { font-size: 13px; }
  .preview-placeholder .hint { font-size: 11px; color: #484f58; }
  #preview-error {
    display: none;
    padding: 10px 12px;
    background: rgba(248,81,73,0.1);
    border-bottom: 1px solid rgba(248,81,73,0.22);
    color: #ffb4ae;
    font-size: 12px;
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #preview-error.visible { display: block; }

  /* ── LIVE BADGE ── */
  #live-badge {
    display: none;
    align-items: center; gap: 5px;
    font-size: 11px; color: var(--green);
    font-weight: 500;
  }
  #live-badge.visible { display: flex; }
  #live-badge::before {
    content: ''; display: block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── DROP ZONE ── */
  #drop-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(88,166,255,0.07);
    border: 2px dashed var(--accent);
    border-radius: 8px;
    z-index: 100;
    align-items: center; justify-content: center;
    font-size: 18px; color: var(--accent); font-weight: 500;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  /* ── RESTORE BANNER ── */
  #draft-restore {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(210,153,34,0.1);
    border-bottom: 1px solid rgba(210,153,34,0.18);
    color: #f2cc60;
    font-size: 12px;
  }
  #draft-restore.show { display: flex; }
  #draft-restore .message { flex: 1; }

  /* ── FIND PANEL ── */
  #find-panel {
    display: none;
    position: fixed;
    top: 62px;
    right: 16px;
    width: min(360px, calc(100vw - 32px));
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    z-index: 1200;
  }
  #find-panel.visible { display: block; }
  .find-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .find-row:last-child { margin-bottom: 0; }
  .find-row input {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 32px;
    padding: 0 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: 12px var(--font-ui);
  }
  .find-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
  }
  #find-status {
    min-width: 68px;
    color: var(--muted);
    font-size: 11px;
    text-align: right;
    font-family: var(--font-mono);
  }
  .find-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 8px 16px;
    border-radius: 20px; opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* ── UPLOAD INPUT ── */
  #file-input { display: none; }

  /* ── RESPONSIVE VISIBILITY ── */
  .mobile-only { display: none !important; }

  /* ── MOBILE LAYOUT ── */
  @media (max-width: 767px) {
    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    #main,
    #editor-pane,
    #cm-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    .mobile-only  { display: inline-flex !important; }
    .desktop-only { display: none !important; }

    #drag-handle  { display: none !important; }
    #preview-pane { display: none !important; }

    #editor-pane {
      width: 100% !important;
      border-right: none;
    }

    #titlebar {
      height: auto;
      min-height: 52px;
      flex-wrap: wrap;
      padding: 8px 12px;
      row-gap: 6px;
      column-gap: 6px;
      overflow-x: hidden;
    }

    #titlebar .sep    { display: none; }
    #titlebar .filename {
      min-width: 0;
      max-width: 120px;
    }

    #titlebar .spacer {
      display: none;
    }

    .btn {
      height: 38px;
      min-width: 0;
      padding: 0 10px;
      font-size: 12px;
      flex: 0 1 auto;
    }

    .status-label {
      margin-right: auto;
    }

    #find-panel,
    #draft-restore {
      display: none !important;
    }

    .CodeMirror {
      width: 100% !important;
      max-width: 100% !important;
      font-size: 14px !important;
    }
    .CodeMirror-lines {
      padding-bottom: 16em !important;
    }
    .CodeMirror-scroll {
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .CodeMirror-lines,
    .CodeMirror-line {
      max-width: 100%;
    }
    .CodeMirror textarea,
    .CodeMirror input {
      font-size: 16px !important;
    }
    .CodeMirror { font-size: 14px !important; }
    .CodeMirror-gutters { min-width: 36px; }
    .CodeMirror-linenumber { padding: 0 6px 0 2px; }
  }

  /* ── MINIMAP (resize hint) ── */
  .resize-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--muted); pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLEBAR -->
  <div id="titlebar">
    <div class="logo">&lt;<span>/</span>&gt; html<span>viewer</span></div>
    <div class="sep"></div>
    <div class="filename" id="filename-display">untitled.html</div>
    <div class="spacer"></div>
    <div id="status-dot" class="status-dot"></div>
    <div class="status-label" id="status-label">ready</div>
    <div class="sep"></div>
    <label for="file-input">
      <div class="btn" tabindex="0" role="button" onkeydown="if(event.key==='Enter')document.getElementById('file-input').click()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M4 6l4-5 4 5M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Upload
      </div>
    </label>
    <input type="file" id="file-input" accept=".html,.htm">
    <button class="btn primary desktop-only" id="btn-preview">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
      Preview
    </button>
    <button class="btn desktop-only" id="btn-sync">
      <span class="dot"></span>
      Live Sync
    </button>
    <button class="btn desktop-only" id="btn-clear">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9a1 1 0 001 1h6a1 1 0 001-1l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Clear
    </button>
    <button class="btn desktop-only" id="btn-export" title="Download project as a zip">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2v7M5 6l3 3 3-3M3 11v2a1 1 0 001 1h8a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export
    </button>
    <button class="btn desktop-only" id="btn-find" title="Find and replace">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Find
    </button>
    <button class="btn desktop-only" id="btn-wrap" title="Toggle word wrap">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h9a2.5 2.5 0 010 5H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 7l-2 2 2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 9h3M2 12h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Wrap
    </button>
    <button class="btn desktop-only" id="btn-undo" title="Undo (Cmd/Ctrl+Z)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 8h6a4 4 0 110 8H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn desktop-only" id="btn-redo" title="Redo (Cmd/Ctrl+Shift+Z)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 8H7a4 4 0 100 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- Mobile-only actions -->
    <button class="btn mobile-only" id="btn-select-all">

<script>
  const STARTER = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f9f9f9;
      color: #1a1a1a;
    }
    h1 { color: #2563eb; }
    p { line-height: 1.7; color: #444; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>Edit this HTML in the editor and click <strong>Preview</strong> to see it rendered — or toggle <strong>Live Sync</strong> to see changes update automatically.</p>
</body>
</html>`;
  const AUTOSAVE_KEY = 'html-viewer-autosave-v1';
  const AUTOSAVE_META_KEY = 'html-viewer-autosave-meta-v1';
  const AUTOSAVE_PROJECT_KEY = 'html-viewer-project-autosave-v1';
  const PREVIEW_HOOK = `<script>
window.addEventListener('error', function (event) {
  try {
    parent.postMessage({ source: 'html-viewer-preview', type: 'error', message: event.message || 'Script error' }, '*');
  } catch (e) {}
});
window.addEventListener('unhandledrejection', function (event) {
  try {
    var reason = event.reason;
    parent.postMessage({ source: 'html-viewer-preview', type: 'error', message: reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection') }, '*');
  } catch (e) {}
});
window.addEventListener('DOMContentLoaded', function () {
  try {
    parent.postMessage({ source: 'html-viewer-preview', type: 'loaded' }, '*');
  } catch (e) {}
});
<\/script>`;
  const PREVIEW_CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob: https:; media-src data: blob: https:; font-src data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'unsafe-inline' https:; connect-src https:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">`;
  const STORAGE_SHIM = `
<script>
(function () {
  function createStorageShim() {
    var store = Object.create(null);
    return {
      get length() { return Object.keys(store).length; },
      key: function (index) { return Object.keys(store)[index] || null; },
      getItem: function (key) {
        key = String(key);
        return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null;
      },
      setItem: function (key, value) { store[String(key)] = String(value); },
      removeItem: function (key) { delete store[String(key)]; },
      clear: function () { store = Object.create(null); }
    };
  }
  function ensureStorage(name) {
    try {
      window[name].getItem('__html_viewer_probe__');
    } catch (err) {
      try {
        Object.defineProperty(window, name, {
          value: createStorageShim(),
          configurable: true
        });
      } catch (defineErr) {}
    }
  }
  ensureStorage('localStorage');
  ensureStorage('sessionStorage');
})();
<\/script>`;

  // FIX #6: Loop guard now resets its timer on each loop entry rather than
  // using a single start time for the entire page lifetime. This prevents a
  // second legitimate (but slow) loop from tripping the watchdog immediately
  // because elapsed time already exceeded the threshold.
  const LOOP_GUARD = `
<script>
(function () {
  window.__htmlViewerLoopGuard = (function () {
    var start = null;
    return function () {
      if (start === null) { start = Date.now(); return; }
      if (Date.now() - start > 1200) {
        start = null;
        throw new Error('Possible infinite loop stopped by preview watchdog');
      }
    };
  })();
})();
<\/script>`;

  // ── CodeMirror setup ──
  const LARGE_FILE_THRESHOLD = 800;
  const app = document.getElementById('app');
  const cmWrap = document.getElementById('cm-wrap');
  const editor = CodeMirror(cmWrap, {
    value: STARTER,
    mode: 'htmlmixed',
    theme: 'dracula',
    lineNumbers: true,
    lineWrapping: true,
    autoCloseTags: true,
    matchBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    flattenSpans: false,
    addModeClass: false,
    viewportMargin: 50,
    pollInterval: 100,
    gutters: ['CodeMirror-linenumbers', 'cm-error-gutter'],
    extraKeys: { Tab: cm => cm.replaceSelection('  ') },
  });

  function applyModeForSize(lineCount) {
    const currentMode = editor.getOption('mode');
    if (activeFile === 'css') {
      if (currentMode !== 'css') editor.setOption('mode', 'css');
      editor.setOption('matchBrackets', true);
      return;
    }
    if (activeFile === 'js') {
      if (currentMode !== 'javascript') editor.setOption('mode', 'javascript');
      editor.setOption('matchBrackets', true);
      return;
    }
    if (lineCount > LARGE_FILE_THRESHOLD && currentMode !== 'xml') {
      editor.setOption('mode', 'xml');
      editor.setOption('matchBrackets', false);
      showToast(`Large file — using fast mode (${lineCount} lines)`);
    } else if (lineCount <= LARGE_FILE_THRESHOLD && currentMode !== 'htmlmixed') {
      editor.setOption('mode', 'htmlmixed');
      editor.setOption('matchBrackets', true);
    }
  }

  const mobileMediaQuery = window.matchMedia('(max-width: 767px)');
  function isMobileView() {
    return mobileMediaQuery.matches;
  }

  function optimizeEditorForViewport() {
    editor.setOption('viewportMargin', isMobileView() ? 12 : 50);
    editor.refresh();
  }

  // ── State ──
  let liveSync = false;
  let liveTimer = null;
  let mobileSelectionPrimed = false;
  let wordWrapEnabled = true;
  let projectFiles = {
    html: STARTER,
    css: '',
    js: ''
  };
  let baselineFiles = { ...projectFiles };
  let activeFile = 'html';
  let currentBaseline = JSON.stringify(baselineFiles);
  let autosaveTimer = null;
  let currentFullscreenPane = null;
  let currentPreviewDevice = 'desktop';
  let lastSearchMatches = [];
  let lastSearchIndex = -1;

  // FIX #1: Track the current blob URL so we can revoke it before creating
  // a new one. Without this, each Live Sync render leaks a blob URL because
  // the previous frame.onload callback is silently replaced before it fires.
  let _currentBlobUrl = null;

  // ── Refs ──
  const btnPreview = document.getElementById('btn-preview');
  const btnSync = document.getElementById('btn-sync');
  const btnClear = document.getElementById('btn-clear');
  const btnExport = document.getElementById('btn-export');
  const btnFind = document.getElementById('btn-find');
  const btnWrap = document.getElementById('btn-wrap');
  const btnUndo = document.getElementById('btn-undo');
  const btnRedo = document.getElementById('btn-redo');
  const btnOpenNew = document.getElementById('btn-open-new');
  const btnRefresh = document.getElementById('btn-refresh-preview');
  const btnEditorFullscreen = document.getElementById('btn-editor-fullscreen');
  const btnPreviewFullscreen = document.getElementById('btn-preview-fullscreen');
  const previewDeviceButtons = document.querySelectorAll('[data-preview-device]');
  const editorFileButtons = document.querySelectorAll('[data-editor-file]');
  const fileInput = document.getElementById('file-input');
  const frame = document.getElementById('preview-frame');
  const placeholder = document.getElementById('preview-placeholder');
  const previewError = document.getElementById('preview-error');
  const statusDot = document.getElementById('status-dot');
  const statusLabel = document.getElementById('status-label');
  const charCount = document.getElementById('char-count');
  const liveBadge = document.getElementById('live-badge');
  const langBadge = document.getElementById('lang-badge');
  const filenameDisplay = document.getElementById('filename-display');
  const toast = document.getElementById('toast');
  const dropOverlay = document.getElementById('drop-overlay');
  const btnSelectAll = document.getElementById('btn-select-all');
  const btnCopyAll = document.getElementById('btn-copy-all');
  const btnCopyAllDesktop = document.getElementById('btn-copy-all-desktop');
  const draftRestore = document.getElementById('draft-restore');
  const draftRestoreMessage = document.getElementById('draft-restore-message');
  const btnRestoreDraft = document.getElementById('btn-restore-draft');
  const btnDismissDraft = document.getElementById('btn-dismiss-draft');
  const findPanel = document.getElementById('find-panel');
  const findInput = document.getElementById('find-input');
  const replaceInput = document.getElementById('replace-input');
  const findStatus = document.getElementById('find-status');
  const btnFindPrev = document.getElementById('btn-find-prev');
  const btnFindNext = document.getElementById('btn-find-next');
  const btnReplaceOne = document.getElementById('btn-replace-one');
  const btnReplaceAll = document.getElementById('btn-replace-all');
  const btnCloseFind = document.getElementById('btn-close-find');
  const btnOpenNewMobile = document.getElementById('btn-open-new-mobile');
  const scroller = editor.getScrollerElement();
  const minimapContainer = document.getElementById('minimap-container');
  const minimapCanvas = document.getElementById('minimap-canvas');
  const minimapViewport = document.getElementById('minimap-viewport');

  // ── Error-line state ──
  let errorLineHandles = [];

  // ── Minimap state ──
  const MM_LINE_H = 2;
  const MM_CHAR_W = 1;
  const MM_WIDTH  = 110;
  let mmRenderTimer = null;
  let mmDragging = false;

  // Dracula-mapped token colours for minimap
  const MM_COLORS = {
    keyword: '#ff79c6', atom: '#bd93f9', number: '#bd93f9',
    string: '#f1fa8c', 'string-2': '#f1fa8c',
    comment: '#6272a4', def: '#50fa7b',
    'variable-2': '#8be9fd', 'variable-3': '#50fa7b',
    property: '#8be9fd', attribute: '#50fa7b',
    builtin: '#8be9fd', operator: '#ff79c6',
    tag: '#ff79c6', type: '#8be9fd', meta: '#f8f8f2',
    error: '#ff5555',
  };
  function mmTokenColor(type) {
    if (!type) return 'rgba(248,248,242,0.28)';
    for (const [k, v] of Object.entries(MM_COLORS)) {
      if (type.includes(k)) return v + 'b0';
    }
    return 'rgba(248,248,242,0.28)';
  }

  // FIX #7: Static CRC32 lookup table extracted to a module-level constant.
  // Previously it was stored as a property on the crc32 function itself,
  // which is an unusual pattern that obscures intent.
  const CRC32_TABLE = Array.from({ length: 256 }, (_, n) => {
    let c = n;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    return c >>> 0;
  });

  function setStatus(type, label) {
    statusDot.className = 'status-dot' + (type === 'live' ? ' live' : '');
    statusLabel.textContent = label;
  }

  function syncActiveFile() {
    projectFiles[activeFile] = editor.getValue();
  }

  function serializeProject(files = projectFiles) {
    return JSON.stringify(files);
  }

  function getProjectFileLabel(file = activeFile) {
    return file === 'html' ? 'HTML' : file === 'css' ? 'CSS' : 'JS';
  }

  function updateDirtyState() {
    syncActiveFile();
    const dirty = serializeProject() !== currentBaseline;
    filenameDisplay.classList.toggle('dirty', dirty);
    if (dirty) {
      statusDot.className = 'status-dot dirty';
      statusLabel.textContent = 'unsaved';
    } else if (liveSync) {
      setStatus('live', 'live');
    } else {
      setStatus('ready', 'ready');
    }
  }

  function rememberBaseline(files = projectFiles, label = 'ready') {
    baselineFiles = { ...files };
    currentBaseline = serializeProject(baselineFiles);
    filenameDisplay.classList.remove('dirty');
    setStatus(liveSync ? 'live' : 'ready', liveSync ? 'live' : label);
  }

  function updateCharCount() {
    const value = editor.getValue();
    const lines = editor.lineCount();
    charCount.textContent = `${getProjectFileLabel()} · ${value.length.toLocaleString()} chars · ${lines} ln`;
    applyModeForSize(lines);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function autosaveDraft() {
    try {
      syncActiveFile();
      localStorage.setItem(AUTOSAVE_KEY, projectFiles.html);
      localStorage.setItem(AUTOSAVE_PROJECT_KEY, JSON.stringify(projectFiles));
      localStorage.setItem(AUTOSAVE_META_KEY, JSON.stringify({
        filename: filenameDisplay.textContent,
        savedAt: Date.now()
      }));
    } catch (err) {
      showToast('Autosave unavailable');
    }
  }

  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(autosaveDraft, 350);
  }

  function clearDraftBanner() {
    draftRestore.classList.remove('show');
  }

  function hidePreviewError() {
    previewError.classList.remove('visible');
    previewError.textContent = '';
  }

  function showPreviewError(message) {
    previewError.textContent = `Preview error: ${message}`;
    previewError.classList.add('visible');
    clearErrorLines();
    const line = parseErrorLine(message);
    if (line !== null) highlightErrorLine(line);
  }

  // ── Error-line helpers ──
  function parseErrorLine(msg) {
    let m;
    m = msg.match(/\bline[:\s]+(\d+)/i);           if (m) return +m[1];
    m = msg.match(/<anonymous>:(\d+):\d+/);         if (m) return +m[1];
    m = msg.match(/(?:eval|Function):(\d+):\d+/);   if (m) return +m[1];
    m = msg.match(/:(\d+):\d+(?:\)|$)/m);           if (m) return +m[1];
    m = msg.match(/\((\d+):\d+\)/);                 if (m) return +m[1];
    return null;
  }

  function clearErrorLines() {
    errorLineHandles.forEach(h => {
      editor.removeLineClass(h, 'background', 'cm-error-line');
      editor.setGutterMarker(h, 'cm-error-gutter', null);
    });
    errorLineHandles = [];
  }

  function highlightErrorLine(lineNum) {
    const idx = lineNum - 1;
    if (idx < 0 || idx >= editor.lineCount()) return;
    const handle = editor.getLineHandle(idx);
    if (!handle) return;
    editor.addLineClass(handle, 'background', 'cm-error-line');
    const dot = document.createElement('div');
    dot.className = 'cm-error-gutter-marker';
    dot.title = `Error near line ${lineNum}`;
    editor.setGutterMarker(handle, 'cm-error-gutter', dot);
    errorLineHandles.push(handle);
    editor.scrollIntoView({ line: idx, ch: 0 }, 120);
  }

  // ── Minimap ──
  function scheduleMinimapRender() {
    clearTimeout(mmRenderTimer);
    mmRenderTimer = setTimeout(doMinimapRender, 80);
  }

  function doMinimapRender() {
    if (!app.classList.contains('editor-fullscreen')) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cH = minimapContainer.clientHeight;
    const cW = minimapContainer.clientWidth;
    if (!cH || !cW) return;

    const totalLines = editor.lineCount();
    const canvasH = Math.max(cH, totalLines * MM_LINE_H);

    const needsResize = minimapCanvas.width  !== cW * dpr
                     || minimapCanvas.height !== canvasH * dpr;
    if (needsResize) {
      minimapCanvas.width  = cW * dpr;
      minimapCanvas.height = canvasH * dpr;
      minimapCanvas.style.width  = cW + 'px';
      minimapCanvas.style.height = canvasH + 'px';
    }

    const ctx = minimapCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0e1117';
    ctx.fillRect(0, 0, cW, canvasH);

    const scrollTop = minimapContainer.scrollTop;
    const firstLine = Math.max(0, Math.floor(scrollTop / MM_LINE_H) - 10);
    const lastLine  = Math.min(totalLines - 1,
                               Math.ceil((scrollTop + cH) / MM_LINE_H) + 10);

    // FIX #4: Use getLineTokens() (one call per line) instead of getTokenAt()
    // (one call per character). For a 100-line visible region at 80 chars each,
    // this reduces tokenizer invocations from ~8,000 to ~100 per render.
    for (let i = firstLine; i <= lastLine; i++) {
      const tokens = editor.getLineTokens(i, true);
      for (const tok of tokens) {
        const x  = tok.start * MM_CHAR_W;
        const x2 = Math.min(tok.end * MM_CHAR_W, cW);
        if (x2 > x) {
          ctx.fillStyle = mmTokenColor(tok.type);
          ctx.fillRect(x, i * MM_LINE_H, x2 - x, MM_LINE_H - 0.5);
        }
      }
    }

    updateMinimapViewport();
  }

  function updateMinimapViewport() {
    if (!app.classList.contains('editor-fullscreen')) return;
    const si = editor.getScrollInfo();
    const totalLines = editor.lineCount();
    const canvasH = Math.max(minimapContainer.clientHeight, totalLines * MM_LINE_H);
    const fraction  = si.height > 0 ? si.top  / si.height : 0;
    const vpFrac    = si.height > 0 ? si.clientHeight / si.height : 1;
    const vpTop     = fraction * canvasH;
    const vpH       = Math.max(16, vpFrac * canvasH);

    minimapViewport.style.top    = vpTop + 'px';
    minimapViewport.style.height = vpH   + 'px';

    const cH = minimapContainer.clientHeight;
    const mid = vpTop + vpH / 2;
    const idealScroll = mid - cH / 2;
    minimapContainer.scrollTop = Math.max(0,
      Math.min(canvasH - cH, idealScroll));
  }

  function mmScrollEditorToY(mmY) {
    const totalLines = editor.lineCount();
    const canvasH = Math.max(minimapContainer.clientHeight, totalLines * MM_LINE_H);
    const fraction = mmY / Math.max(1, canvasH);
    const si = editor.getScrollInfo();
    editor.scrollTo(0, fraction * si.height);
  }

  minimapContainer.addEventListener('mousedown', e => {
    mmDragging = true;
    mmScrollEditorToY(e.offsetY + minimapContainer.scrollTop);
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!mmDragging) return;
    const rect = minimapContainer.getBoundingClientRect();
    mmScrollEditorToY(e.clientY - rect.top + minimapContainer.scrollTop);
  });
  window.addEventListener('mouseup', () => { mmDragging = false; });

  editor.on('scroll', updateMinimapViewport);

  function escapeClosingTag(value, tagName) {
    return value.replace(new RegExp(`</${tagName}`, 'gi'), `<\\/${tagName}`);
  }

  function instrumentLoops(js) {
    // NOTE: This regex-based approach cannot handle all valid JS syntax
    // (e.g. loop conditions containing nested function calls or template
    // literals with parens). A proper AST transformer would be needed for
    // complete coverage. The guard is injected at loop body entry, which
    // correctly catches infinite loops for the majority of real-world cases.
    return js
      .replace(/\b(for|while)\b\s*\([\s\S]*?\)\s*\{/g, '$&__htmlViewerLoopGuard();')
      .replace(/\bdo\s*\{/g, '$&__htmlViewerLoopGuard();');
  }

  // NOTE: instrumentInlineScripts uses regex to locate <script> blocks.
  // It will misparse if a script contains '<\/script>' as a string literal
  // (e.g. document.write('<\/script>')). This is an inherent limitation of
  // regex-based HTML parsing and would require a proper HTML parser to fix.
  function instrumentInlineScripts(html) {
    return html.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi, (match, attrs, body) => {
      if (attrs && /\bsrc\s*=/i.test(attrs)) return match;
      return `<script${attrs}>${escapeClosingTag(instrumentLoops(body), 'script')}<\/script>`;
    });
  }

  function injectIntoHead(html, content) {
    if (/<\/head>/i.test(html)) return html.replace(/<\/head>/i, `${content}</head>`);
    if (/<html[^>]*>/i.test(html)) return html.replace(/<html([^>]*)>/i, `<html$1><head>${content}</head>`);
    return `<head>${content}</head>${html}`;
  }

  function injectIntoHeadStart(html, content) {
    if (/<head[^>]*>/i.test(html)) return html.replace(/<head([^>]*)>/i, `<head$1>${content}`);
    return injectIntoHead(html, content);
  }

  function injectIntoBodyEnd(html, content) {
    if (/<\/body>/i.test(html)) return html.replace(/<\/body>/i, `${content}</body>`);
    return `${html}${content}`;
  }

  function buildPreviewHtml() {
    syncActiveFile();
    let html = projectFiles.html.trim() || '<!DOCTYPE html><html><head><title>Preview</title></head><body></body></html>';
    html = instrumentInlineScripts(html);
    html = injectIntoHeadStart(html, PREVIEW_CSP + STORAGE_SHIM + PREVIEW_HOOK + LOOP_GUARD);
    if (projectFiles.css.trim()) {
      html = injectIntoHead(html, `<style>${escapeClosingTag(projectFiles.css, 'style')}</style>`);
    }
    if (projectFiles.js.trim()) {
      html = injectIntoBodyEnd(html, `<script>${escapeClosingTag(instrumentLoops(projectFiles.js), 'script')}<\/script>`);
    }
    return html;
  }

  // FIX #1: Revoke the previous blob URL before creating a new one.
  // The old code replaced frame.onload before the previous load could fire,
  // meaning old URLs were never revoked and accumulated in memory.
  function renderPreview() {
    hidePreviewError();
    clearErrorLines();
    frame.style.display = 'block';
    placeholder.style.display = 'none';
    if (_currentBlobUrl) {
      URL.revokeObjectURL(_currentBlobUrl);
      _currentBlobUrl = null;
    }
    const blob = new Blob([buildPreviewHtml()], { type: 'text/html' });
    const newUrl = URL.createObjectURL(blob);
    _currentBlobUrl = newUrl;
    // Capture newUrl by value so a subsequent renderPreview() call that
    // updates _currentBlobUrl doesn't cause this callback to revoke the wrong URL.
    frame.onload = () => {
      URL.revokeObjectURL(newUrl);
      if (_currentBlobUrl === newUrl) _currentBlobUrl = null;
    };
    frame.src = newUrl;
  }

  function buildExportHtml() {
    syncActiveFile();
    let html = projectFiles.html.trim() || '<!DOCTYPE html><html><head><title>Project</title></head><body></body></html>';
    if (projectFiles.css.trim()) {
      html = injectIntoHead(html, '<link rel="stylesheet" href="style.css">');
    }
    if (projectFiles.js.trim()) {
      html = injectIntoBodyEnd(html, '<script src="script.js"><\/script>');
    }
    return html;
  }

  function crc32(bytes) {
    let crc = -1;
    for (let i = 0; i < bytes.length; i += 1) {
      crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ bytes[i]) & 0xff];
    }
    return (crc ^ -1) >>> 0;
  }

  function writeUint16(bytes, value) {
    bytes.push(value & 0xff, (value >>> 8) & 0xff);
  }

  function writeUint32(bytes, value) {
    bytes.push(value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff);
  }

  function makeZip(files) {
    const encoder = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;

    files.forEach(file => {
      const nameBytes = encoder.encode(file.name);
      const data = encoder.encode(file.content);
      const crc = crc32(data);
      const local = [];
      writeUint32(local, 0x04034b50);
      writeUint16(local, 20);
      writeUint16(local, 0);
      writeUint16(local, 0);
      writeUint16(local, 0);
      writeUint16(local, 0);
      writeUint32(local, crc);
      writeUint32(local, data.length);
      writeUint32(local, data.length);
      writeUint16(local, nameBytes.length);
      writeUint16(local, 0);
      local.push(...nameBytes, ...data);
      chunks.push(new Uint8Array(local));

      const entry = [];
      writeUint32(entry, 0x02014b50);
      writeUint16(entry, 20);
      writeUint16(entry, 20);
      writeUint16(entry, 0);
      writeUint16(entry, 0);
      writeUint16(entry, 0);
      writeUint16(entry, 0);
      writeUint32(entry, crc);
      writeUint32(entry, data.length);
      writeUint32(entry, data.length);
      writeUint16(entry, nameBytes.length);
      writeUint16(entry, 0);
      writeUint16(entry, 0);
      writeUint16(entry, 0);
      writeUint16(entry, 0);
      writeUint32(entry, 0);
      writeUint32(entry, offset);
      entry.push(...nameBytes);
      central.push(new Uint8Array(entry));
      offset += local.length;
    });

    const centralOffset = offset;
    const centralSize = central.reduce((sum, entry) => sum + entry.length, 0);
    const end = [];
    writeUint32(end, 0x06054b50);
    writeUint16(end, 0);
    writeUint16(end, 0);
    writeUint16(end, files.length);
    writeUint16(end, files.length);
    writeUint32(end, centralSize);
    writeUint32(end, centralOffset);
    writeUint16(end, 0);
    return new Blob([...chunks, ...central, new Uint8Array(end)], { type: 'application/zip' });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function escapeRegExp(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function getSearchMatches(query) {
    if (!query) return [];
    const content = editor.getValue();
    const regex = new RegExp(escapeRegExp(query), 'g');
    const matches = [];
    let match;
    while ((match = regex.exec(content)) !== null) {
      matches.push({ from: match.index, to: match.index + query.length });
      if (match.index === regex.lastIndex) regex.lastIndex += 1;
    }
    return matches;
  }

  function indexToPos(index) {
    return editor.posFromIndex(index);
  }

  function updateFindStatus() {
    const total = lastSearchMatches.length;
    const current = total ? lastSearchIndex + 1 : 0;
    findStatus.textContent = `${current} / ${total}`;
  }

  function selectMatch(index, focusEditor = true) {
    if (!lastSearchMatches.length) {
      lastSearchIndex = -1;
      updateFindStatus();
      return false;
    }
    lastSearchIndex = (index + lastSearchMatches.length) % lastSearchMatches.length;
    const match = lastSearchMatches[lastSearchIndex];
    const from = indexToPos(match.from);
    const to = indexToPos(match.to);
    editor.setSelection(from, to);
    editor.scrollIntoView({ from, to }, 80);
    if (focusEditor) editor.focus();
    updateFindStatus();
    return true;
  }

  function refreshSearch(selectFirst = false, focusEditor = true) {
    lastSearchMatches = getSearchMatches(findInput.value);
    if (!lastSearchMatches.length) {
      lastSearchIndex = -1;
      updateFindStatus();
      return false;
    }
    if (selectFirst || lastSearchIndex >= lastSearchMatches.length || lastSearchIndex < 0) {
      return selectMatch(0, focusEditor);
    }
    updateFindStatus();
    return true;
  }

  function toggleFindPanel(forceOpen) {
    const open = forceOpen ?? !findPanel.classList.contains('visible');
    findPanel.classList.toggle('visible', open);
    if (open) {
      refreshSearch(true, false);
      findInput.focus();
    } else {
      editor.focus();
    }
  }

  // FIX #5: Warn the user before loading a file if they have unsaved CSS or
  // JS edits. Previously those edits were silently discarded with no prompt.
  function loadFile(file) {
    if (!file || !file.name.match(/\.html?$/i)) {
      showToast('Please upload an .html or .htm file');
      return;
    }
    syncActiveFile();
    const hasCSSOrJS = projectFiles.css.trim() || projectFiles.js.trim();
    if (hasCSSOrJS && !confirm('Loading a file will clear your CSS and JS. Continue?')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const value = e.target.result;
      projectFiles = { html: value, css: '', js: '' };
      activeFile = 'html';
      editor.setValue(value);
      filenameDisplay.textContent = file.name;
      editorFileButtons.forEach(btn => {
        btn.classList.toggle('toggle-on', btn.dataset.editorFile === activeFile);
        btn.setAttribute('aria-pressed', String(btn.dataset.editorFile === activeFile));
      });
      langBadge.textContent = getProjectFileLabel();
      applyModeForSize(editor.lineCount());
      rememberBaseline(projectFiles, 'file loaded');
      clearDraftBanner();
      autosaveDraft();
      showToast(`Loaded: ${file.name}`);
      if (liveSync) schedLiveUpdate();
    };
    reader.readAsText(file);
  }

  editor.on('change', () => {
    updateCharCount();
    mobileSelectionPrimed = false;
    scheduleAutosave();

    scheduleMinimapRender();

  updateCharCount();

  btnPreview.addEventListener('click', () => {

  btnClear.addEventListener('click', () => {

  // FIX (minor): Only include style.css and script.js in the zip when they

  btnExport.addEventListener('click', () => {

    const zipFiles = [
      { name: 'index.html', content: buildExportHtml() },
      { name: 'README.txt', content: 'Open index.html in a browser. This export keeps HTML, CSS, and JS as separate files.' }
    ];
    if (projectFiles.css.trim()) zipFiles.splice(1, 0, { name: 'style.css', content: projectFiles.css });
    if (projectFiles.js.trim())  zipFiles.splice(projectFiles.css.trim() ? 2 : 1, 0, { name: 'script.js', content: projectFiles.js });
    const zip = makeZip(zipFiles);
    downloadBlob(zip, 'html-viewer-project.zip');

  btnFind.addEventListener('click', () => toggleFindPanel());

  const dragMask = document.createElement('div');

  let startW = 0;

  handle.addEventListener('mousedown', e => {

  document.addEventListener('keydown', e => {

        e.preventDefault();
        setFullscreenPane(currentFullscreenPane);

  btnReplaceOne.addEventListener('click', () => {
    if (!refreshSearch(lastSearchIndex === -1)) {
      showToast('No matches found');
      return;
    }
    const match = lastSearchMatches[lastSearchIndex];
    editor.replaceRange(replaceInput.value, indexToPos(match.from), indexToPos(match.to));

  btnReplaceAll.addEventListener('click', () => {

      return;

    const matches = getSearchMatches(query);
    if (!matches.length) {
      showToast('No matches found');
      return;

    editor.operation(() => {
      for (let i = matches.length - 1; i >= 0; i -= 1) {
        const match = matches[i];
        editor.replaceRange(replaceInput.value, indexToPos(match.from), indexToPos(match.to));
      }
    });
    refreshSearch(true);
    showToast(`Replaced ${matches.length} match${matches.length === 1 ? '' : 'es'}`);

  // FIX #3 & #9: All localStorage access is now wrapped in try/catch.
  // Safari private browsing throws a SecurityError on any localStorage call,

  btnRestoreDraft.addEventListener('click', () => {
    let savedProject = null, savedDraft = null;
    try {
      savedProject = localStorage.getItem(AUTOSAVE_PROJECT_KEY);
      savedDraft   = localStorage.getItem(AUTOSAVE_KEY);
    } catch (e) {}
    if (savedProject == null && savedDraft == null) return;
    let meta = {};
    try { meta = JSON.parse(localStorage.getItem(AUTOSAVE_META_KEY) || '{}'); } catch (e) {}
    try {
      projectFiles = savedProject
        ? { html: '', css: '', js: '', ...JSON.parse(savedProject) }
        : { html: savedDraft || '', css: '', js: '' };
    } catch (err) {
      projectFiles = { html: savedDraft || '', css: '', js: '' };

      btn.classList.toggle('toggle-on', btn.dataset.editorFile === activeFile);
      btn.setAttribute('aria-pressed', String(btn.dataset.editorFile === activeFile));

  // FIX #8: Check the return value of document.execCommand('copy').
  // If it returns false (no selection, browser policy) show an accurate

  async function copyEditorContent() {
    const value = editor.getValue();
    if (!value) { showToast('Editor is empty'); return; }
    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        showToast('All code copied');
      } else {
        editor.execCommand('selectAll');
        const ok = document.execCommand('copy');
        showToast(ok ? 'All code copied' : 'Copy failed — select manually');
      }
      editor.focus();
    } catch (err) {
      showToast('Copy failed');
    }
  }

  btnOpenNewMobile.addEventListener('click', () => {
    syncActiveFile();
    if (!projectFiles.html.trim() && !projectFiles.css.trim() && !projectFiles.js.trim()) {
      showToast('Project is empty');
      return;
    }
    const blob = new Blob([buildPreviewHtml()], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  let pinchStartDist = null;
  let pinchStartSize = 13;
  let currentFontSize = 13;
  let scrollTouchStartY = null;

  function setEditorFontSize(px) {
    currentFontSize = Math.min(36, Math.max(8, px));
    editor.getWrapperElement().style.fontSize = currentFontSize + 'px';
    editor.refresh();
  }

  cmWrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartSize = currentFontSize;
      e.preventDefault();
    }
  }, { passive: false });

  cmWrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist !== null) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setEditorFontSize(Math.round(pinchStartSize * (dist / pinchStartDist)));
      e.preventDefault();
    }
  }, { passive: false });

  cmWrap.addEventListener('touchend', e => {
    if (e.touches.length < 2) pinchStartDist = null;
  });

  scroller.addEventListener('touchstart', e => {
    if (!isMobileView() || e.touches.length !== 1) return;
    scrollTouchStartY = e.touches[0].clientY;
  }, { passive: true });

  scroller.addEventListener('touchmove', e => {
    if (!isMobileView() || e.touches.length !== 1 || scrollTouchStartY === null) return;
    const currentY = e.touches[0].clientY;
    const deltaY = currentY - scrollTouchStartY;
    const atTop = scroller.scrollTop <= 0;
    const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;

    if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
      e.preventDefault();
    }
  }, { passive: false });

  scroller.addEventListener('touchend', () => {
    scrollTouchStartY = null;
  }, { passive: true });

  // FIX #7: Debounce the resize handler. editor.refresh() forces a full
  // CodeMirror layout pass; firing it on every pixel during a window resize
  // causes measurable jank on large files.
  let _resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(() => {
      optimizeEditorForViewport();
      scheduleMinimapRender();
    }, 60);
  });

  // FIX #3: Wrap startup localStorage reads in try/catch. Safari private
  // browsing throws SecurityError on any localStorage access, which would
  // crash the entire script before the editor initialised.
  let savedProject = null;
  let savedDraft = null;
  try {
    savedProject = localStorage.getItem(AUTOSAVE_PROJECT_KEY);
    savedDraft   = localStorage.getItem(AUTOSAVE_KEY);
  } catch (e) {}

  if ((savedProject !== null && savedProject !== JSON.stringify(projectFiles)) || (savedProject === null && savedDraft !== null && savedDraft !== STARTER)) {
    try {
      const meta = JSON.parse(localStorage.getItem(AUTOSAVE_META_KEY) || '{}');
      const when = meta.savedAt ? new Date(meta.savedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
      draftRestoreMessage.textContent = when
        ? `A saved draft from ${when} was found from your last session.`
        : 'A saved draft was found from your last session.';
    } catch (err) {}
    draftRestore.classList.add('show');
  } else {
    autosaveDraft();
  }

  optimizeEditorForViewport();
  setTimeout(() => editor.refresh(), 50);
</script>
</body>
</html>
