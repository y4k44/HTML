<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>HTML Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,0.12);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,0.12);
    --amber: #d29922;
    --red: #f85149;
    --radius: 6px;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

  /* ── TITLEBAR ── */
  #titlebar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    user-select: none;
  }
  #titlebar .logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  #titlebar .logo span { color: var(--muted); font-weight: 400; }
  #titlebar .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  #titlebar .filename {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    min-width: 80px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #titlebar .spacer { flex: 1; }
  #titlebar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #titlebar .status-dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
  #titlebar .status-label { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    flex-shrink: 0;
    /* iOS: remove 300ms tap delay and default tap flash */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    /* iOS: ensure buttons are always tappable */
    -webkit-appearance: none;
    user-select: none;
  }
  .btn:hover { background: #2d333b; border-color: #636e7b; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(88,166,255,0.2); }
  .btn.success { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .btn.success:hover { background: rgba(63,185,80,0.2); }
  .btn.toggle-on { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .btn.toggle-on .dot { background: var(--green); }
  .btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
  .btn svg { flex-shrink: 0; }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #editor-pane { display: flex; flex-direction: column; width: 50%; min-width: 200px; border-right: 1px solid var(--border); overflow: hidden; }
  #preview-pane { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  /* ── PANE HEADERS ── */
  .pane-header {
    height: 36px; padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border2);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .pane-header .pane-title { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .pane-header .spacer { flex: 1; }
  .pane-header .char-count { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .lang-badge {
    font-size: 10px; font-family: var(--font-mono);
    background: rgba(88,166,255,0.1); color: var(--accent);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 4px; padding: 1px 6px;
  }

  /* ── DRAG HANDLE ── */
  #drag-handle {
    width: 4px; cursor: col-resize; background: var(--border);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #drag-handle:hover, #drag-handle.dragging { background: var(--accent); }

  /* ── CODEMIRROR OVERRIDES ── */
  .CodeMirror {
    height: 100% !important;
    font-family: var(--font-mono) !important;
    font-size: 13px !important;
    line-height: 1.65 !important;
    background: var(--bg) !important;
  }
  .CodeMirror-scroll { height: 100% !important; }
  #cm-wrap { flex: 1; overflow: hidden; }

  /* ── PREVIEW IFRAME ── */
  #preview-frame {
    flex: 1; width: 100%; border: none;
    background: #fff;
  }
  .preview-placeholder {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    color: var(--muted);
  }
  .preview-placeholder .icon {
    width: 48px; height: 48px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-placeholder p { font-size: 13px; }
  .preview-placeholder .hint { font-size: 11px; color: #484f58; }

  /* ── LIVE BADGE ── */
  #live-badge {
    display: none;
    align-items: center; gap: 5px;
    font-size: 11px; color: var(--green);
    font-weight: 500;
  }
  #live-badge.visible { display: flex; }
  #live-badge::before {
    content: ''; display: block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── DROP ZONE ── */
  #drop-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(88,166,255,0.07);
    border: 2px dashed var(--accent);
    border-radius: 8px;
    z-index: 100;
    align-items: center; justify-content: center;
    font-size: 18px; color: var(--accent); font-weight: 500;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 8px 16px;
    border-radius: 20px; opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* ── UPLOAD INPUT ── */
  #file-input { display: none; }

  /* ── RESPONSIVE VISIBILITY ── */
  .mobile-only { display: none !important; }

  /* ── MOBILE LAYOUT ── */
  @media (max-width: 767px) {
    .mobile-only  { display: inline-flex !important; }
    .desktop-only { display: none !important; }

    #drag-handle  { display: none !important; }
    #preview-pane { display: none !important; }

    #editor-pane {
      width: 100% !important;
      border-right: none;
    }

    #titlebar {
      height: auto;
      min-height: 52px;
      flex-wrap: wrap;
      padding: 8px 12px;
      row-gap: 6px;
    }

    #titlebar .sep    { display: none; }
    #titlebar .filename { max-width: 120px; }

    .btn {
      height: 38px;
      padding: 0 13px;
      font-size: 13px;
    }

    .CodeMirror { font-size: 14px !important; }
    .CodeMirror-gutters { min-width: 36px; }
    .CodeMirror-linenumber { padding: 0 6px 0 2px; }
  }

  /* ── MINIMAP (resize hint) ── */
  .resize-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--muted); pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLEBAR -->
  <div id="titlebar">
    <div class="logo">&lt;<span>/</span>&gt; html<span>viewer</span></div>
    <div class="sep"></div>
    <div class="filename" id="filename-display">untitled.html</div>
    <div class="spacer"></div>
    <div id="status-dot" class="status-dot"></div>
    <div class="status-label" id="status-label">ready</div>
    <div class="sep"></div>
    <label for="file-input">
      <div class="btn" tabindex="0" role="button" onkeydown="if(event.key==='Enter')document.getElementById('file-input').click()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M4 6l4-5 4 5M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Upload
      </div>
    </label>
    <input type="file" id="file-input" accept=".html,.htm">
    <button class="btn primary desktop-only" id="btn-preview">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
      Preview
    </button>
    <button class="btn desktop-only" id="btn-sync">
      <span class="dot"></span>
      Live Sync
    </button>
    <button class="btn desktop-only" id="btn-clear">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9a1 1 0 001 1h6a1 1 0 001-1l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Clear
    </button>
    <!-- Mobile-only actions -->
    <button class="btn mobile-only" id="btn-select-all">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M4 8h8M8 4v8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Select All
    </button>
    <button class="btn primary mobile-only" id="btn-open-new-mobile">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 2H2a1 1 0 00-1 1v11a1 1 0 001 1h11a1 1 0 001-1v-4M10 1h5v5M15 1L7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Open Tab
    </button>
  </div>

  <!-- MAIN SPLIT AREA -->
  <div id="main">
    <!-- EDITOR PANE -->
    <div id="editor-pane">
      <div class="pane-header">
        <div class="pane-title">editor</div>
        <div class="lang-badge">HTML</div>
        <div class="spacer"></div>
        <div id="live-badge">live</div>
        <div class="char-count" id="char-count">0 chars</div>
      </div>
      <div id="cm-wrap"></div>
    </div>

    <!-- DRAG HANDLE -->
    <div id="drag-handle"></div>

    <!-- PREVIEW PANE -->
    <div id="preview-pane">
      <div class="pane-header">
        <div class="pane-title">preview</div>
        <div class="spacer"></div>
        <button class="btn" id="btn-open-new" title="Open in new tab">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M6 2H2a1 1 0 00-1 1v11a1 1 0 001 1h11a1 1 0 001-1v-4M10 1h5v5M15 1L7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Open tab
        </button>
        <button class="btn" id="btn-refresh-preview" title="Reload preview">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M1 8a7 7 0 1012.9-3.8M1 8V3m0 5H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Reload
        </button>
      </div>
      <div class="preview-placeholder" id="preview-placeholder">
        <div class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7 8l3 3-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <p>No preview yet</p>
        <p class="hint">Paste HTML and click Preview — or enable Live Sync</p>
      </div>
      <iframe id="preview-frame" title="HTML Preview" sandbox="allow-scripts allow-same-origin" style="display:none;"></iframe>
    </div>
  </div>
</div>

<!-- DROP OVERLAY -->
<div id="drop-overlay">Drop your HTML file here</div>

<!-- TOAST -->
<div id="toast" id="toast"></div>

<script>
  const STARTER = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f9f9f9;
      color: #1a1a1a;
    }
    h1 { color: #2563eb; }
    p { line-height: 1.7; color: #444; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>Edit this HTML in the editor and click <strong>Preview</strong> to see it rendered — or toggle <strong>Live Sync</strong> to see changes update automatically.</p>
</body>
</html>`;

  // ── CodeMirror setup ──
  const LARGE_FILE_THRESHOLD = 800; // lines above which we use lite mode

  const cmWrap = document.getElementById('cm-wrap');
  const editor = CodeMirror(cmWrap, {
    value: STARTER,
    mode: 'htmlmixed',
    theme: 'dracula',
    lineNumbers: true,
    lineWrapping: false,
    autoCloseTags: true,
    matchBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    // Performance: reduce DOM node count dramatically on large files
    flattenSpans: false,
    addModeClass: false,
    // Render 50 lines above/below viewport for smooth scrolling without lag
    viewportMargin: 50,
    // Don't re-tokenize the whole file on every keystroke
    pollInterval: 100,
    extraKeys: { Tab: cm => cm.replaceSelection('  ') },
  });

  // Dynamically switch between full htmlmixed and lightweight xml-only
  // mode depending on file size to keep the editor responsive.
  function applyModeForSize(lineCount) {
    const currentMode = editor.getOption('mode');
    if (lineCount > LARGE_FILE_THRESHOLD && currentMode !== 'xml') {
      editor.setOption('mode', 'xml');
      editor.setOption('matchBrackets', false);
      showToast(`Large file — using fast mode (${lineCount} lines)`);
    } else if (lineCount <= LARGE_FILE_THRESHOLD && currentMode !== 'htmlmixed') {
      editor.setOption('mode', 'htmlmixed');
      editor.setOption('matchBrackets', true);
    }
  }

  // ── State ──
  let liveSync = false;
  let liveTimer = null;
  let previewActive = false;

  // ── Refs ──
  const btnPreview = document.getElementById('btn-preview');
  const btnSync = document.getElementById('btn-sync');
  const btnClear = document.getElementById('btn-clear');
  const btnOpenNew = document.getElementById('btn-open-new');
  const btnRefresh = document.getElementById('btn-refresh-preview');
  const fileInput = document.getElementById('file-input');
  const frame = document.getElementById('preview-frame');
  const placeholder = document.getElementById('preview-placeholder');
  const statusDot = document.getElementById('status-dot');
  const statusLabel = document.getElementById('status-label');
  const charCount = document.getElementById('char-count');
  const liveBadge = document.getElementById('live-badge');
  const filenameDisplay = document.getElementById('filename-display');
  const toast = document.getElementById('toast');
  const dropOverlay = document.getElementById('drop-overlay');

  // ── Char count ──
  function updateCharCount() {
    const v = editor.getValue();
    const lines = editor.lineCount();
    charCount.textContent = `${v.length.toLocaleString()} chars · ${lines} ln`;
    applyModeForSize(lines);
  }
  editor.on('change', () => {
    updateCharCount();
    setStatus('editing', 'editing…');
    if (liveSync) schedLiveUpdate();
  });
  updateCharCount();

  // ── Status helpers ──
  function setStatus(type, label) {
    statusDot.className = 'status-dot' + (type === 'live' ? ' live' : '');
    statusLabel.textContent = label;
  }

  // ── Preview ──
  function renderPreview(html) {
    frame.style.display = 'block';
    placeholder.style.display = 'none';
    previewActive = true;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    frame.onload = () => URL.revokeObjectURL(url);
    frame.src = url;
  }

  btnPreview.addEventListener('click', () => {
    const html = editor.getValue().trim();
    if (!html) { showToast('Editor is empty'); return; }
    renderPreview(html);
    setStatus('ready', 'previewing');
    showToast('Preview updated');
  });

  // ── Live Sync ──
  function schedLiveUpdate() {
    clearTimeout(liveTimer);
    // Scale debounce with file size: small files update fast, large files wait longer
    const lines = editor.lineCount();
    const delay = lines > LARGE_FILE_THRESHOLD ? 800 : 420;
    liveTimer = setTimeout(() => {
      const html = editor.getValue().trim();
      if (html) renderPreview(html);
      setStatus('live', 'live');
    }, delay);
  }

  btnSync.addEventListener('click', () => {
    liveSync = !liveSync;
    btnSync.classList.toggle('toggle-on', liveSync);
    btnSync.querySelector('.dot').style.background = liveSync ? 'var(--green)' : '';
    liveBadge.classList.toggle('visible', liveSync);
    if (liveSync) {
      setStatus('live', 'live');
      schedLiveUpdate();
      showToast('Live sync on — edits update preview automatically');
    } else {
      setStatus('ready', 'ready');
      showToast('Live sync off');
    }
  });

  // ── Refresh ──
  btnRefresh.addEventListener('click', () => {
    renderPreview(editor.getValue());
    showToast('Preview reloaded');
  });

  // ── Open in tab ──
  btnOpenNew.addEventListener('click', () => {
    const html = editor.getValue();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  // ── Clear ──
  btnClear.addEventListener('click', () => {
    if (confirm('Clear all editor content?')) {
      editor.setValue('');
      editor.focus();
      frame.style.display = 'none';
      placeholder.style.display = '';
      filenameDisplay.textContent = 'untitled.html';
      setStatus('ready', 'ready');
      showToast('Editor cleared');
    }
  });

  // ── File upload ──
  function loadFile(file) {
    if (!file || !file.name.match(/\.html?$/i)) {
      showToast('Please upload an .html or .htm file');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      editor.setValue(e.target.result);
      filenameDisplay.textContent = file.name;
      applyModeForSize(editor.lineCount());
      showToast(`Loaded: ${file.name}`);
      setStatus('ready', 'file loaded');
      if (liveSync) schedLiveUpdate();
    };
    reader.readAsText(file);
  }

  fileInput.addEventListener('change', e => { loadFile(e.target.files[0]); fileInput.value = ''; });

  // ── Drag & Drop ──
  document.addEventListener('dragover', e => { e.preventDefault(); dropOverlay.classList.add('show'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) dropOverlay.classList.remove('show'); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    dropOverlay.classList.remove('show');
    loadFile(e.dataTransfer.files[0]);
  });

  // ── Split pane drag ──
  // A full-screen transparent mask sits on top during drag so the iframe
  // cannot steal mouse events (which causes the blue-selection bug).
  const dragMask = document.createElement('div');
  dragMask.style.cssText = 'display:none;position:fixed;inset:0;z-index:9999;cursor:col-resize;';
  document.body.appendChild(dragMask);

  const handle = document.getElementById('drag-handle');
  const editorPane = document.getElementById('editor-pane');
  const main = document.getElementById('main');
  let dragging = false, startX, startW;

  handle.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = editorPane.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    // Block iframe from capturing events & prevent text selection
    frame.style.pointerEvents = 'none';
    dragMask.style.display = 'block';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const total = main.offsetWidth;
    const newW = Math.max(180, Math.min(total - 200, startW + dx));
    editorPane.style.width = newW + 'px';
    editor.refresh();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    frame.style.pointerEvents = '';
    dragMask.style.display = 'none';
    editor.refresh();
  });

  // ── Toast ──
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ── Keyboard shortcut: Cmd/Ctrl+Enter = Preview ──
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      btnPreview.click();
    }
  });

  // ── Mobile: Select All ──
  document.getElementById('btn-select-all').addEventListener('click', () => {
    editor.execCommand('selectAll');
    editor.focus();
    showToast('All code selected');
  });

  // ── Mobile: Open Tab (mirrors desktop button) ──
  document.getElementById('btn-open-new-mobile').addEventListener('click', () => {
    const html = editor.getValue().trim();
    if (!html) { showToast('Editor is empty'); return; }
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  // ── Pinch-to-zoom on the code editor ──
  // Tracks two-finger spread/pinch and scales the editor font size smoothly.
  let pinchStartDist = null;
  let pinchStartSize = 13;
  let currentFontSize = 13;

  function setEditorFontSize(px) {
    currentFontSize = Math.min(36, Math.max(8, px));
    editor.getWrapperElement().style.fontSize = currentFontSize + 'px';
    editor.refresh();
  }

  cmWrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartSize = currentFontSize;
      e.preventDefault();
    }
  }, { passive: false });

  cmWrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist !== null) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setEditorFontSize(Math.round(pinchStartSize * (dist / pinchStartDist)));
      e.preventDefault();
    }
  }, { passive: false });

  cmWrap.addEventListener('touchend', e => {
    if (e.touches.length < 2) pinchStartDist = null;
  });

  // Initial refresh
  setTimeout(() => editor.refresh(), 50);
</script>
</body>
</html>
